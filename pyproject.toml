[project]
name = "biomed-retrieval-jax"
version = "0.1.0"
description = "Verified biomedical literature retrieval in JAX, built on eqx-zoo (research demo, not for clinical use)"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Zane", email = "zane.n.neave@gmail.com" }]
requires-python = ">=3.12"
keywords = ["jax", "equinox", "retrieval", "semantic-search", "biomedical", "embeddings"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Indexing",
    "Typing :: Typed",
]
dependencies = [
    "equinox>=0.12",
    "eqx-zoo>=0.3.6",
    "jax>=0.5",
    "jaxtyping>=0.3",
    "numpy>=1.26",
    "tokenizers>=0.21",
]

[project.scripts]
biomed-search = "biomed_retrieval_jax.cli:main"

[project.urls]
Homepage = "https://github.com/xquantize/biomed-retrieval-jax"
Repository = "https://github.com/xquantize/biomed-retrieval-jax"
Issues = "https://github.com/xquantize/biomed-retrieval-jax/issues"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytrec-eval-terrier>=0.5.8",
    "ruff>=0.16.9",
    "sentence-transformers>=3",
    "torch>=2.14.0",
    "transformers>=4.51.3",
]

[tool.uv]
constraint-dependencies = [
    # Match eqx-zoo, whose tests always resolve huggingface-hub < 2 (released transformers
    # versions require it). This only affects our lockfile, not the published metadata.
    "huggingface-hub<2",
]
# CI runs on x86-64 Linux, where the PyTorch CPU index versions torch wheels `X.Y.Z+cpu` and
# plain `X.Y.Z` has no wheel. Requiring that platform makes every resolution, including
# `--resolution lowest-direct`, skip versions that cannot be installed there, without pinning
# torch to one version.
required-environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["checkpoint(name): needs the named pretrained checkpoint (deselect with -m 'not checkpoint')"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "D"]
ignore = ["F722"]  # jaxtyping shape strings like "seq dim" aren't Python expressions

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]
